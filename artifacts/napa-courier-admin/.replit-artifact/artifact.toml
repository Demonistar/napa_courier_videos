kind = "web"
previewPath = "/"
title = "NAPA Courier Admin"
version = "1.0.0"
id = "artifacts/napa-courier-admin"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22316

[services.development]
run = "pnpm --filter @workspace/napa-courier-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/napa-courier-admin", "run", "build" ]
serve = "static"
publicDir = "artifacts/napa-courier-admin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22316"
BASE_PATH = "/"
