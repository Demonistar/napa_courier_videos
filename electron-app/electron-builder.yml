appId: com.napacourier.admin
productName: NAPA Courier Admin
copyright: Copyright © 2025 NAPA Courier

directories:
  buildResources: build
  output: dist-installer

files:
  - out/**/*
  - "!out/**/*.map"

# ── Windows ───────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  # ── Code signing (prevents SmartScreen "unrecognized app" warning) ──────────
  # electron-builder reads these environment variables automatically at build
  # time. Set them in your shell before running `npm run package:win`.
  #
  #   WIN_CSC_LINK         — path to your .pfx certificate file, OR a
  #                          base64-encoded copy of the .pfx (useful for CI)
  #                          e.g.  C:\certs\napa-courier.pfx
  #                               or  $(certutil -encode cert.pfx tmp && cat tmp)
  #   WIN_CSC_KEY_PASSWORD — the password you chose when exporting the .pfx
  #
  # Both variables must be set. If either is missing, electron-builder skips
  # signing and the resulting installer will trigger SmartScreen.
  #
  # Recommended certificate types (in order of SmartScreen trust):
  #   1. EV (Extended Validation) code-signing cert — immediate SmartScreen
  #      reputation; requires hardware token (USB key). ~$300–500/yr.
  #      Vendors: DigiCert, Sectigo, GlobalSign.
  #   2. OV (Organization Validation) code-signing cert — builds SmartScreen
  #      reputation over time (usually clears after ~100–500 installs).
  #      ~$100–200/yr from the same vendors.
  #
  # See README.md → "Code Signing (Windows)" for the full setup guide.
  signingHashAlgorithms:
    - sha256

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NAPA Courier Admin
  license: build/license.txt

# ── macOS ─────────────────────────────────────────────────────────────────────
# Builds run on a macos-latest GitHub Actions runner (see build-macos.yml).
# Produces two .dmg files: one for Intel (x64) and one for Apple Silicon (arm64).
mac:
  target:
    - target: dmg
      arch: [x64, arm64]   # x64 = Intel Macs, arm64 = M1/M2/M3 Macs
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # ── Notarization (optional — suppresses Gatekeeper warning on first launch) ──
  #
  # The afterSign hook (electron/notarize.cjs) submits the signed .app to
  # Apple's servers so Gatekeeper trusts it on any Mac without any warnings.
  # It is a no-op unless all three secrets below are set in the environment.
  #
  # Set these as GitHub repository secrets to enable notarization in CI:
  #
  #   APPLE_ID                    — Apple ID email (e.g. you@example.com)
  #   APPLE_APP_SPECIFIC_PASSWORD — app-specific password from appleid.apple.com
  #                                 → Account → Sign-In and Security →
  #                                   App-Specific Passwords
  #   APPLE_TEAM_ID               — 10-character Team ID from
  #                                 developer.apple.com/account → Membership Details
  #
  # Without these secrets the build still succeeds and produces unsigned .dmg
  # files. Admins can bypass the Gatekeeper warning once via right-click → Open.

afterSign: electron/notarize.cjs

dmg:
  sign: false                   # set to true once you have an Apple Developer certificate
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

publish: null
