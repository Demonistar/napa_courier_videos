name: Build Windows Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create/update releases and upload assets

jobs:
  build-windows:
    name: Build & sign Windows installer
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js + pnpm ────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ── 3. Lockfile sanity check ──────────────────────────────────────────────
      #
      # electron-app/package-lock.json must be generated OUTSIDE the pnpm
      # workspace (no parent node_modules/.pnpm store).  If it contains
      # resolved paths pointing at the pnpm store it was regenerated from inside
      # the repo — npm ci will then resolve ~45 packages instead of ~522 and
      # electron-vite will be missing from PATH, causing a cryptic build failure.
      #
      # Use scripts/regen-lockfile.sh (or a Windows machine) to regenerate it
      # safely.  See electron-app/README.md "Rebuilding" section for details.
      - name: Check lockfile is pnpm-store-free
        shell: bash
        run: |
          count=$(grep -c 'node_modules/.pnpm' electron-app/package-lock.json || true)
          if [ "$count" -gt 0 ]; then
            echo "ERROR: electron-app/package-lock.json contains $count reference(s) to" >&2
            echo "  node_modules/.pnpm — it was regenerated from inside the pnpm workspace." >&2
            echo "" >&2
            echo "Run scripts/regen-lockfile.sh from the repo root to regenerate it safely," >&2
            echo "or run 'npm install --ignore-scripts' inside a clean temp directory." >&2
            echo "See electron-app/README.md (Rebuilding section) for full instructions." >&2
            exit 1
          fi
          echo "✓ package-lock.json is clean (no pnpm store references)"

      # ── 4. Install dependencies ───────────────────────────────────────────────
      #
      # Do NOT use --frozen-lockfile here.  The pnpm-lock.yaml is generated on
      # Linux and marks Windows-specific optional native binaries (e.g.
      # @rollup/rollup-win32-x64-msvc) as "-" (excluded).  With
      # --frozen-lockfile, pnpm honours those exclusions on the Windows runner,
      # causing a "Cannot find module @rollup/rollup-win32-x64-msvc" failure
      # inside electron-vite build.
      #
      # Without --frozen-lockfile, pnpm still uses the lockfile for all
      # non-optional packages (fully deterministic) but correctly resolves
      # platform-specific optional native binaries for the current runner OS.
      # Install from the workspace root so pnpm resolves catalog: specifiers.
      - name: Install dependencies
        run: pnpm install

      # ── 4. Stamp version from release tag ────────────────────────────────────
      #
      # Strips the leading "v" from the tag (e.g. v1.2.0 → 1.2.0) and writes it
      # into electron-app/package.json so electron-builder picks it up for the
      # installer filename and About screen.
      #
      # Uses a Node script instead of `npm version` because the package.json
      # contains pnpm catalog: specifiers that npm does not understand.
      #
      # The tag is passed through an env variable rather than inline shell
      # interpolation to prevent workflow-command injection from crafted tag names.
      # The version is validated against a strict SemVer pattern before use.
      - name: Set version from tag
        shell: bash
        working-directory: electron-app
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${GIT_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '$GIT_TAG' does not produce a valid SemVer version ('$VERSION')" >&2
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          ACTUAL=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "Error: package.json version is '$ACTUAL', expected '$VERSION'" >&2
            exit 1
          fi
          echo "✓ package.json version set to $VERSION"

      # ── 5. Copy shared components from the web app source ────────────────────
      #
      # setup-components.sh copies shadcn/ui primitives, tree, form, and other
      # shared code from artifacts/napa-courier-admin/src/ into electron-app/src/.
      # Run it with Git Bash, which is pre-installed on windows-latest runners.
      - name: Copy shared components
        shell: bash
        working-directory: electron-app
        run: bash setup-components.sh

      # ── 6. Build and package (without publishing yet) ────────────────────────
      #
      # We intentionally separate build from publish so the signature
      # verification step (below) can fail the workflow before any unsigned
      # artifact reaches GitHub Releases.
      #
      # Code signing (prevents SmartScreen "unrecognized app" warning):
      #   WIN_CSC_LINK          — base64-encoded .pfx certificate (repo secret)
      #   WIN_CSC_KEY_PASSWORD  — password for the .pfx (repo secret)
      #
      # If either signing secret is absent, electron-builder silently skips
      # signing and exits 0.  The next step catches that case.
      - name: Build and package
        working-directory: electron-app
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: pnpm run build && electron-builder --win --publish never

      # ── 7. Verify Authenticode signature ─────────────────────────────────────
      #
      # When WIN_CSC_LINK is set, `signtool verify /pa` checks that the
      # installer carries a valid Authenticode signature.  It exits non-zero
      # (failing the workflow) when the signature is malformed or the
      # certificate has expired.
      #
      # When WIN_CSC_LINK is absent (e.g. a pre-release test build), signing
      # is skipped by electron-builder.  This step still locates the .exe and
      # exposes it for the publish step, but it warns rather than failing so
      # unsigned test builds can reach GitHub Releases.  SmartScreen will show
      # an "unrecognised publisher" warning for such builds, which is acceptable
      # for internal pre-release testing.  Signed builds MUST be used for any
      # installer distributed to external admins.
      #
      # This step runs on the windows-latest runner where signtool.exe ships
      # as part of the pre-installed Windows SDK.
      #
      # The installer path is written to a step output so the publish step
      # below can upload exactly the same file — without re-globbing or
      # picking up unintended executables.
      - name: Verify Authenticode signature
        id: verify-signature
        shell: pwsh
        working-directory: electron-app
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          # Locate the top-level NSIS installer (not win-unpacked/ executables).
          # -File and no -Recurse ensure we stay in dist-installer/ itself.
          $exe = Get-ChildItem -Path dist-installer -Filter "*.exe" -File |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Error "No installer .exe found in dist-installer/ — build may have failed."
            exit 1
          }

          # Expose the installer name to the publish step via output.
          echo "INSTALLER_NAME=$($exe.Name)" >> $env:GITHUB_OUTPUT

          if ([string]::IsNullOrEmpty($env:WIN_CSC_LINK)) {
            Write-Warning @"
          ⚠  WIN_CSC_LINK is not set — the installer is UNSIGNED.
             SmartScreen will show an 'unrecognised publisher' warning.
             This is acceptable for pre-release test builds.
             Set WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD as repository secrets
             before distributing to external admins.
          "@
            Write-Host "Skipping Authenticode verification (no certificate configured)."
          } else {
            Write-Host "Verifying signature on: $($exe.FullName)"
            # signtool.exe is on PATH on windows-latest runners (Windows SDK)
            & signtool verify /pa "$($exe.FullName)"
            if ($LASTEXITCODE -ne 0) {
              Write-Error @"
          Authenticode signature verification FAILED.
          The installer '$($exe.Name)' has an invalid or expired signature.
          Ensure WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD contain a valid .pfx.
          "@
              exit 1
            }
            Write-Host "Signature OK — proceeding to publish."
          }

      # ── 8. Publish to GitHub Releases ────────────────────────────────────────
      #
      # Only reached when the signature check above passes.
      # Uploads exactly the verified installer (.exe), the electron-updater
      # manifest (latest.yml), and the blockmap used for differential updates.
      #
      # GH_TOKEN — GitHub Actions provides this automatically; no secret needed.
      #
      # The release tag is consumed from an env variable (GIT_TAG) rather than
      # being interpolated directly into PowerShell source, preventing a
      # workflow-command injection via a crafted tag name.
      - name: Publish to GitHub Releases
        shell: pwsh
        working-directory: electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAG: ${{ github.ref_name }}
          INSTALLER_NAME: ${{ steps.verify-signature.outputs.INSTALLER_NAME }}
        run: |
          # Validate the tag looks like a SemVer release before using it as a
          # CLI argument (mirrors the validation in the "Set version from tag"
          # step so a malformed tag cannot inject into the gh command).
          if ($env:GIT_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "GIT_TAG '$($env:GIT_TAG)' is not a valid vX.Y.Z release tag."
            exit 1
          }

          # Create the release if it does not already exist.
          gh release view $env:GIT_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GIT_TAG `
              --title $env:GIT_TAG `
              --generate-notes `
              --draft=false
          }

          # Upload exactly the verified installer plus the electron-updater
          # artifacts (latest.yml manifest and .blockmap for delta updates).
          # No -Recurse: all three items live at the top level of dist-installer/.
          $installer = Join-Path "dist-installer" $env:INSTALLER_NAME
          $manifest  = Join-Path "dist-installer" "latest.yml"
          $blockmap  = Join-Path "dist-installer" "$($env:INSTALLER_NAME).blockmap"

          $uploadFiles = @($installer, $manifest)
          if (Test-Path $blockmap) { $uploadFiles += $blockmap }

          gh release upload $env:GIT_TAG $uploadFiles --clobber
