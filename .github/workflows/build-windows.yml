name: Build Windows Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to upload release assets

jobs:
  build-windows:
    name: Build & sign Windows installer
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: electron-app/package-lock.json

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        working-directory: electron-app
        run: npm ci

      # ── 4. Stamp version from release tag ────────────────────────────────────
      #
      # Strips the leading "v" from the tag (e.g. v1.2.0 → 1.2.0) and writes it
      # into electron-app/package.json so electron-builder picks it up for the
      # installer filename and About screen.  --no-git-tag-version prevents npm
      # from trying to create a new git tag inside the runner.
      - name: Set version from tag
        shell: bash
        working-directory: electron-app
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version

      # ── 5. Copy shared components from the web app source ────────────────────
      #
      # setup-components.sh copies shadcn/ui primitives, tree, form, and other
      # shared code from artifacts/napa-courier-admin/src/ into electron-app/src/.
      # Run it with Git Bash, which is pre-installed on windows-latest runners.
      - name: Copy shared components
        shell: bash
        working-directory: electron-app
        run: bash setup-components.sh

      # ── 6. Build & package ────────────────────────────────────────────────────
      #
      # WIN_CSC_LINK    — base64-encoded .pfx certificate stored as a repo secret.
      #                   electron-builder detects the "base64," prefix and decodes
      #                   it automatically.
      # WIN_CSC_KEY_PASSWORD — password for the .pfx, stored as a repo secret.
      #
      # If neither secret is set the build still succeeds but the installer will
      # not be signed (SmartScreen will warn on first run).
      - name: Build and package Windows installer
        working-directory: electron-app
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: npm run package:win

      # ── 6. Upload installer as a GitHub Release asset ─────────────────────────
      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: electron-app/dist-installer/*.exe
          fail_on_unmatched_files: true
