name: Build Windows Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create/update releases and upload assets

jobs:
  build-windows:
    name: Build & sign Windows installer
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: electron-app/package-lock.json

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        working-directory: electron-app
        run: npm ci

      # ── 4. Stamp version from release tag ────────────────────────────────────
      #
      # Strips the leading "v" from the tag (e.g. v1.2.0 → 1.2.0) and writes it
      # into electron-app/package.json so electron-builder picks it up for the
      # installer filename and About screen.  --no-git-tag-version prevents npm
      # from trying to create a new git tag inside the runner.
      # --allow-same-version makes this a no-op when the version was already
      # bumped locally by `npm run release:patch` before pushing the tag.
      - name: Set version from tag
        shell: bash
        working-directory: electron-app
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # ── 5. Copy shared components from the web app source ────────────────────
      #
      # setup-components.sh copies shadcn/ui primitives, tree, form, and other
      # shared code from artifacts/napa-courier-admin/src/ into electron-app/src/.
      # Run it with Git Bash, which is pre-installed on windows-latest runners.
      - name: Copy shared components
        shell: bash
        working-directory: electron-app
        run: bash setup-components.sh

      # ── 6. Build, package, and publish to GitHub Releases ────────────────────
      #
      # `--publish always` tells electron-builder to:
      #   1. Build the NSIS installer (.exe)
      #   2. Create (or update) the GitHub Release for this tag
      #   3. Upload the installer AND the `latest.yml` update manifest
      #
      # The update manifest is what allows installed copies of the app to detect
      # new versions via electron-updater. Without it, auto-updates won't work.
      #
      # GH_TOKEN — GitHub Actions provides this automatically (no secret to add).
      #
      # Code signing (prevents SmartScreen "unrecognized app" warning):
      #   WIN_CSC_LINK          — base64-encoded .pfx certificate (repo secret)
      #   WIN_CSC_KEY_PASSWORD  — password for the .pfx (repo secret)
      #
      # If neither signing secret is set the build still succeeds but the
      # installer will be unsigned (SmartScreen will warn on first run).
      - name: Build, package, and publish
        working-directory: electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: npm run publish:win
