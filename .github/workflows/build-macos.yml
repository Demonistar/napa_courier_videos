name: Build macOS Installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create/update releases and upload assets

jobs:
  build-macos:
    name: Build macOS installers (Intel + Apple Silicon)
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js + pnpm ────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ── 3. Install dependencies ───────────────────────────────────────────────
      #
      # --frozen-lockfile ensures CI always matches the committed pnpm-lock.yaml.
      # Install from the workspace root so pnpm resolves catalog: specifiers.
      - name: Install dependencies
        run: pnpm install

      # ── 4. Stamp version from release tag ────────────────────────────────────
      #
      # Strips the leading "v" from the tag (e.g. v1.2.0 → 1.2.0) and writes it
      # into electron-app/package.json so electron-builder picks it up for the
      # installer filename and About screen.
      #
      # Uses a Node script instead of `npm version` because the package.json
      # contains pnpm catalog: specifiers that npm does not understand.
      #
      # The tag is passed through an env variable rather than inline shell
      # interpolation to prevent workflow-command injection from crafted tag names.
      # The version is validated against a strict SemVer pattern before use.
      - name: Set version from tag
        working-directory: electron-app
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${GIT_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '$GIT_TAG' does not produce a valid SemVer version ('$VERSION')" >&2
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          ACTUAL=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "Error: package.json version is '$ACTUAL', expected '$VERSION'" >&2
            exit 1
          fi
          echo "✓ package.json version set to $VERSION"

      # ── 5. Copy shared components from the web app source ────────────────────
      #
      # setup-components.sh copies shadcn/ui primitives, tree, form, and other
      # shared code from artifacts/napa-courier-admin/src/ into electron-app/src/.
      - name: Copy shared components
        working-directory: electron-app
        run: bash setup-components.sh

      # ── 6. Build and package (no upload yet) ─────────────────────────────────
      #
      # Builds both DMG files (Intel x64 + Apple Silicon arm64) and runs the
      # notarization afterSign hook if the APPLE_* secrets are present.
      # `--publish never` deliberately withholds the upload so that step 7 can
      # verify the code signature before anything reaches GitHub Releases.
      #
      # Code signing (prevents Gatekeeper "unverified developer" warning):
      #   CSC_LINK          — base64-encoded Developer ID Application .p12 (repo secret)
      #   CSC_KEY_PASSWORD  — password for the .p12 (repo secret)
      #
      # Notarization (optional — submits signed app to Apple for full approval):
      # The afterSign hook (electron/notarize.cjs) is a no-op unless all three
      # APPLE_* secrets below are set. Notarization requires signing secrets too.
      #
      #   APPLE_ID                    — Apple ID email (e.g. you@example.com)
      #   APPLE_APP_SPECIFIC_PASSWORD — app-specific password from
      #                                 appleid.apple.com → Sign-In and Security
      #   APPLE_TEAM_ID               — 10-character Team ID from
      #                                 developer.apple.com/account → Membership
      #
      # DROPBOX_APP_KEY is required for the app to connect to Dropbox at runtime.
      - name: Build and package
        working-directory: electron-app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: pnpm run build && electron-builder --mac --publish never

      # ── 7. Verify code signature ──────────────────────────────────────────────
      #
      # Checks that both .app bundles carry a valid Developer ID signature before
      # any artifact is uploaded.  If CSC_LINK / CSC_KEY_PASSWORD were absent or
      # mis-configured, electron-builder silently skips signing and exits 0; this
      # step catches that case and fails the workflow so no unsigned installer
      # reaches admins.
      #
      # `codesign` is a macOS-native tool present on every macos-latest runner —
      # no extra installs required.
      #
      # electron-builder places each .app in a per-arch subdirectory of the
      # output folder (dist-installer/):
      #   mac/       — Intel (x64)
      #   mac-arm64/ — Apple Silicon (arm64)
      - name: Verify code signature
        working-directory: electron-app
        run: |
          APP_NAME="NAPA Courier Admin.app"
          for APP_DIR in "dist-installer/mac" "dist-installer/mac-arm64"; do
            APP_PATH="${APP_DIR}/${APP_NAME}"
            if [ ! -d "${APP_PATH}" ]; then
              echo "Error: expected .app not found at '${APP_PATH}'" >&2
              exit 1
            fi
            echo "Verifying signature: ${APP_PATH}"
            codesign --verify --deep --strict "${APP_PATH}"
            echo "✓ Signature valid: ${APP_PATH}"
          done

      # ── 8. Publish to GitHub Releases ─────────────────────────────────────────
      #
      # Creates (or updates) the GitHub Release for this tag and uploads:
      #   • Both .dmg installers (Intel + Apple Silicon)
      #   • latest-mac.yml — the electron-updater manifest that lets installed
      #     copies of the app detect and download new versions automatically.
      #     Without this file, auto-updates won't work on Mac.
      #
      # This step runs only after the signature check in step 7 passes, so
      # unsigned builds can never reach the release.
      #
      # GH_TOKEN — GitHub Actions provides this automatically (no secret to add).
      - name: Publish to GitHub Releases
        working-directory: electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          TAG="${GIT_TAG}"
          # Create the release if it does not yet exist; ignore the error if it
          # was already created by a concurrent job (e.g. the Windows workflow).
          gh release create "${TAG}" --title "${TAG}" --generate-notes 2>/dev/null || true
          # Upload the DMGs and the electron-updater manifest, replacing any
          # previously uploaded files with the same name (--clobber).
          gh release upload "${TAG}" \
            dist-installer/*.dmg \
            dist-installer/latest-mac.yml \
            --clobber
