name: Build macOS Installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to upload release assets

jobs:
  build-macos:
    name: Build macOS installers (Intel + Apple Silicon)
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: electron-app/package-lock.json

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        working-directory: electron-app
        run: npm ci

      # ── 4. Copy shared components from the web app source ────────────────────
      #
      # setup-components.sh copies shadcn/ui primitives, tree, form, and other
      # shared code from artifacts/napa-courier-admin/src/ into electron-app/src/.
      - name: Copy shared components
        working-directory: electron-app
        run: bash setup-components.sh

      # ── 5. Build & package ────────────────────────────────────────────────────
      #
      # Notarization (optional — suppresses Gatekeeper "unverified developer" warning):
      #
      #   APPLE_ID                  — your Apple ID email (e.g. you@example.com)
      #   APPLE_APP_SPECIFIC_PASSWORD — an app-specific password from
      #                                 appleid.apple.com → Sign-In and Security
      #   APPLE_TEAM_ID             — 10-character Team ID from
      #                                 developer.apple.com/account → Membership
      #
      # If none of these secrets are set the build still succeeds and produces
      # unsigned .dmg files. Gatekeeper will warn on first launch; admins can
      # bypass once with right-click → Open → Open.
      #
      # DROPBOX_APP_KEY is required for the app to connect to Dropbox at runtime.
      - name: Build and package macOS installers
        working-directory: electron-app
        env:
          # ── Code signing (prevents Gatekeeper "unverified developer" warning) ──
          # CSC_LINK            — base64-encoded Developer ID Application .p12
          #                       certificate exported from Keychain Access.
          #                       Set as a GitHub repository secret.
          # CSC_KEY_PASSWORD    — the password chosen when exporting the .p12.
          #                       Set as a GitHub repository secret.
          #
          # If either is absent, electron-builder skips signing and the .dmg
          # will be unsigned. Gatekeeper will warn on first launch; admins can
          # bypass once with right-click → Open → Open.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # ── Notarization (optional — submits signed app to Apple for approval) ─
          # Requires a signed app (CSC_LINK + CSC_KEY_PASSWORD must also be set).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: npm run package:mac

      # ── 6. Upload both .dmg files as GitHub Release assets ───────────────────
      #
      # Produces two assets on the Releases page:
      #   NAPA Courier Admin-x.y.z.dmg          ← Intel Mac (x64)
      #   NAPA Courier Admin-x.y.z-arm64.dmg    ← Apple Silicon (M1/M2/M3)
      - name: Upload macOS installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: electron-app/dist-installer/*.dmg
          fail_on_unmatched_files: true
