name: Build macOS Installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create/update releases and upload assets

jobs:
  build-macos:
    name: Build macOS installers (Intel + Apple Silicon)
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 3. Install dependencies ───────────────────────────────────────────────
      #
      # electron-app has its own package-lock.json (npm, not pnpm), generated
      # outside the pnpm workspace. Using npm ci here, not pnpm, is required —
      # pnpm-lock.yaml was generated on Linux and marks darwin-specific optional
      # native binaries (e.g. @rollup/rollup-darwin-arm64) as excluded, causing
      # a "Cannot find module @rollup/rollup-darwin-arm64" failure. npm ci
      # correctly resolves the right platform binary for whatever runner it's
      # actually on. Do NOT add --ignore-scripts — Electron's postinstall
      # script needs to run to download the Electron binary itself.
      - name: Install dependencies
        working-directory: electron-app
        run: npm ci

      # ── 4. Stamp version from release tag ────────────────────────────────────
      #
      # Strips the leading "v" from the tag (e.g. v1.2.0 → 1.2.0) and writes it
      # into electron-app/package.json so electron-builder picks it up for the
      # installer filename and About screen.
      #
      # The tag is passed through an env variable rather than inline shell
      # interpolation to prevent workflow-command injection from crafted tag names.
      # The version is validated against a strict SemVer pattern before use.
      - name: Set version from tag
        working-directory: electron-app
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${GIT_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '$GIT_TAG' does not produce a valid SemVer version ('$VERSION')" >&2
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          ACTUAL=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "Error: package.json version is '$ACTUAL', expected '$VERSION'" >&2
            exit 1
          fi
          echo "✓ package.json version set to $VERSION"

      # ── 5. Copy shared components from the web app source ────────────────────
      #
      # setup-components.sh copies shadcn/ui primitives, tree, form, and other
      # shared code from artifacts/napa-courier-admin/src/ into electron-app/src/.
      - name: Copy shared components
        working-directory: electron-app
        run: bash setup-components.sh

# ── 6. Build and package (no upload yet) ─────────────────────────────────
      #
      # Builds both DMG files (Intel x64 + Apple Silicon arm64). No Apple
      # Developer Program certificate has been set up for this project, so
      # CSC_LINK/CSC_KEY_PASSWORD are intentionally left unset — electron-builder
      # produces an unsigned build in that case rather than failing. Unsigned
      # installers trigger a one-time "unidentified developer" warning on first
      # open (right-click → Open bypasses it), acceptable for internal tools.
      # `--publish never` withholds the upload until after the check below.
      - name: Build and package
        working-directory: electron-app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: npm run build && npx electron-builder --mac --publish never --config electron-builder.config.js

      # ── 7. Verify code signature (only if a certificate is actually configured) ─
      #
      # If CSC_LINK is absent, this build is intentionally unsigned — skip
      # verification and warn rather than failing the workflow. If CSC_LINK IS
      # set but the resulting .app isn't actually signed, that's a real
      # misconfiguration and the workflow should fail.
      - name: Verify code signature
        working-directory: electron-app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          APP_NAME="NAPA Courier Admin.app"
          for APP_DIR in "dist-installer/mac" "dist-installer/mac-arm64"; do
            APP_PATH="${APP_DIR}/${APP_NAME}"
            if [ ! -d "${APP_PATH}" ]; then
              echo "Error: expected .app not found at '${APP_PATH}'" >&2
              exit 1
            fi
            if [ -z "$CSC_LINK" ]; then
              echo "⚠ No Apple Developer certificate configured — ${APP_PATH} is UNSIGNED."
              echo "  Users will see an 'unidentified developer' warning on first open."
              echo "  Right-click → Open bypasses it. Fine for internal use."
            else
              echo "Verifying signature: ${APP_PATH}"
              codesign --verify --deep --strict "${APP_PATH}"
              echo "✓ Signature valid: ${APP_PATH}"
            fi
          done

      # ── 8. Publish to GitHub Releases ─────────────────────────────────────────
      #
      # Creates (or updates) the GitHub Release for this tag and uploads:
      #   • Both .dmg installers (Intel + Apple Silicon)
      #   • latest-mac.yml — the electron-updater manifest that lets installed
      #     copies of the app detect and download new versions automatically.
      #     Without this file, auto-updates won't work on Mac.
      #
      # This step runs only after the signature check in step 7 passes, so
      # unsigned builds can never reach the release.
      #
      # GH_TOKEN — GitHub Actions provides this automatically (no secret to add).
      - name: Publish to GitHub Releases
        working-directory: electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          TAG="${GIT_TAG}"
          # Create the release if it does not yet exist; ignore the error if it
          # was already created by a concurrent job (e.g. the Windows workflow).
          gh release create "${TAG}" --title "${TAG}" --generate-notes 2>/dev/null || true
          # Upload the DMGs and the electron-updater manifest, replacing any
          # previously uploaded files with the same name (--clobber).
          gh release upload "${TAG}" \
            dist-installer/*.dmg \
            dist-installer/latest-mac.yml \
            --clobber
