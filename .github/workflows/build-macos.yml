name: Build macOS Installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create/update releases and upload assets

jobs:
  build-macos:
    name: Build macOS installers (Intel + Apple Silicon)
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        working-directory: electron-app
        run: npm install

      # ── 4. Stamp version from release tag ────────────────────────────────────
      #
      # Strips the leading "v" from the tag (e.g. v1.2.0 → 1.2.0) and writes it
      # into electron-app/package.json so electron-builder picks it up for the
      # installer filename and About screen.  --no-git-tag-version prevents npm
      # from trying to create a new git tag inside the runner.
      # --allow-same-version makes this a no-op when the version was already
      # bumped locally by `npm run release:patch` before pushing the tag.
      #
      # The tag is passed through an env variable rather than inline shell
      # interpolation to prevent workflow-command injection from crafted tag names.
      # The version is validated against a strict SemVer pattern before use.
      - name: Set version from tag
        working-directory: electron-app
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${GIT_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '$GIT_TAG' does not produce a valid SemVer version ('$VERSION')" >&2
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # ── 5. Copy shared components from the web app source ────────────────────
      #
      # setup-components.sh copies shadcn/ui primitives, tree, form, and other
      # shared code from artifacts/napa-courier-admin/src/ into electron-app/src/.
      - name: Copy shared components
        working-directory: electron-app
        run: bash setup-components.sh

      # ── 6. Build, package, and publish to GitHub Releases ────────────────────
      #
      # `--publish always` tells electron-builder to:
      #   1. Build both DMG files (Intel x64 + Apple Silicon arm64)
      #   2. Create (or update) the GitHub Release for this tag
      #   3. Upload the DMGs AND the `latest-mac.yml` update manifest
      #
      # The update manifest is what allows installed copies of the app to detect
      # new versions via electron-updater. Without it, auto-updates won't work
      # on Mac.
      #
      # GH_TOKEN — GitHub Actions provides this automatically (no secret to add).
      #
      # Code signing (prevents Gatekeeper "unverified developer" warning):
      #   CSC_LINK          — base64-encoded Developer ID Application .p12 (repo secret)
      #   CSC_KEY_PASSWORD  — password for the .p12 (repo secret)
      #
      # Notarization (optional — submits signed app to Apple for full approval):
      # The afterSign hook (electron/notarize.cjs) is a no-op unless all three
      # APPLE_* secrets below are set. Notarization requires signing secrets too.
      #
      #   APPLE_ID                    — Apple ID email (e.g. you@example.com)
      #   APPLE_APP_SPECIFIC_PASSWORD — app-specific password from
      #                                 appleid.apple.com → Sign-In and Security
      #   APPLE_TEAM_ID               — 10-character Team ID from
      #                                 developer.apple.com/account → Membership
      #
      # DROPBOX_APP_KEY is required for the app to connect to Dropbox at runtime.
      - name: Build, package, and publish
        working-directory: electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: npm run publish:mac
