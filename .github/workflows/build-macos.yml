name: Build macOS Installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to upload release assets

jobs:
  build-macos:
    name: Build macOS installers (Intel + Apple Silicon)
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        working-directory: electron-app
        run: npm install

      # ── 4. Stamp version from release tag ────────────────────────────────────
      #
      # Strips the leading "v" from the tag (e.g. v1.2.0 → 1.2.0) and writes it
      # into electron-app/package.json so electron-builder picks it up for the
      # installer filename and About screen.  --no-git-tag-version prevents npm
      # from trying to create a new git tag inside the runner.
      #
      # The tag is passed through an env variable rather than inline shell
      # interpolation to prevent workflow-command injection from crafted tag names.
      # The version is validated against a strict SemVer pattern before use.
      - name: Set version from tag
        working-directory: electron-app
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${GIT_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '$GIT_TAG' does not produce a valid SemVer version ('$VERSION')" >&2
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version

      # ── 5. Copy shared components from the web app source ────────────────────
      #
      # setup-components.sh copies shadcn/ui primitives, tree, form, and other
      # shared code from artifacts/napa-courier-admin/src/ into electron-app/src/.
      - name: Copy shared components
        working-directory: electron-app
        run: bash setup-components.sh

      # ── 6. Build & package ────────────────────────────────────────────────────
      #
      # Code signing (prevents Gatekeeper "unverified developer" warning):
      #
      #   CSC_LINK          — base64-encoded Developer ID Application .p12
      #                       certificate exported from Keychain Access. Obtain
      #                       from a paid Apple Developer account at
      #                       developer.apple.com → Certificates. Encode for CI:
      #                         base64 -i DeveloperIDApplication.p12 | pbcopy
      #                       electron-builder detects the base64 content and
      #                       decodes it automatically.
      #   CSC_KEY_PASSWORD  — password chosen when exporting the .p12, stored
      #                       as a GitHub repository secret.
      #
      # If either signing secret is absent, electron-builder skips signing and
      # the resulting .dmg will be unsigned. Gatekeeper will warn on first launch;
      # admins can bypass once with right-click → Open → Open.
      #
      # Notarization (optional — submits signed app to Apple for approval):
      # Requires the app to already be signed (CSC_LINK + CSC_KEY_PASSWORD).
      # The afterSign hook (electron/notarize.cjs) is a no-op unless all three
      # APPLE_* secrets below are set.
      #
      #   APPLE_ID                    — Apple ID email (e.g. you@example.com)
      #   APPLE_APP_SPECIFIC_PASSWORD — app-specific password from
      #                                 appleid.apple.com → Sign-In and Security →
      #                                   App-Specific Passwords
      #   APPLE_TEAM_ID               — 10-character Team ID from
      #                                 developer.apple.com/account → Membership
      #
      # DROPBOX_APP_KEY is required for the app to connect to Dropbox at runtime.
      - name: Build and package macOS installers
        working-directory: electron-app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: npm run package:mac

      # ── 7. Upload both .dmg files as GitHub Release assets ───────────────────
      #
      # Produces two assets on the Releases page:
      #   NAPA Courier Admin-x.y.z.dmg          ← Intel Mac (x64)
      #   NAPA Courier Admin-x.y.z-arm64.dmg    ← Apple Silicon (M1/M2/M3)
      - name: Upload macOS installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: electron-app/dist-installer/*.dmg
          fail_on_unmatched_files: true
